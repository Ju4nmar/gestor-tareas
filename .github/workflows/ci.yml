name: Verificaciones

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verificaciones-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Pruebas, tipos, lint y compilacion
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_DEMO_ONLY: "true"
    steps:
      - name: Descargar codigo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Preparar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund
      - name: Ejecutar pruebas
        run: npm test
      - name: Comprobar TypeScript
        run: |
          npx next typegen
          npx tsc --noEmit
      - name: Revisar codigo
        run: npm run lint
      - name: Compilar
        run: npm run build
